name: Build pinned llama.cpp HIP image

on:
  push:
    tags:
      - 'llama-*'          # tag encodes the pin, e.g. llama-6036c635e
  workflow_dispatch:
    inputs:
      ref:
        description: 'llama.cpp commit/tag to pin (e.g. 6036c635e)'
        required: true
        type: string
      push_latest:
        description: 'Also tag this image :latest'
        required: false
        default: false
        type: boolean
      rocm_tag:
        description: 'ROCm base image tag (default 7.14.0-full; e.g. 10.0.0-full)'
        required: false
        default: '7.14.0-full'
        type: string
      gpu_targets:
        description: 'HIP arch(s), ";"-separated (default gfx942; e.g. gfx942;gfx950)'
        required: false
        default: 'gfx942'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve LLAMA_REF and image name
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${GITHUB_REF_NAME#llama-}"      # llama-6036c635e -> 6036c635e
          fi
          [ -n "$REF" ] || { echo "could not resolve LLAMA_REF"; exit 1; }
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # A tag push carries no inputs, so it always builds the default ROCm.
          # Only workflow_dispatch can select a variant.
          ROCM_TAG="${{ inputs.rocm_tag }}"
          ROCM_TAG="${ROCM_TAG:-7.14.0-full}"
          # The image tag names the llama.cpp pin. A non-default ROCm gets a
          # suffix so a variant can never overwrite the reference build.
          if [ "$ROCM_TAG" = "7.14.0-full" ]; then
            ROCM_SUFFIX=""
          else
            ROCM_SUFFIX="-rocm${ROCM_TAG%%.*}"     # 10.0.0-full -> -rocm10
          fi
          # HIP arch(s). Multi-target emits one fat binary carrying code for every
          # arch, as upstream's own release job does. Default stays single-arch
          # gfx942 so a tag push keeps producing the reference image.
          GPU_TARGETS="${{ inputs.gpu_targets }}"
          GPU_TARGETS="${GPU_TARGETS:-gfx942}"
          case "$GPU_TARGETS" in
            gfx942)  ARCH_SUFFIX="" ;;
            *\;*) ARCH_SUFFIX="-multi" ;;
            *)       ARCH_SUFFIX="-${GPU_TARGETS}" ;;
          esac
          echo "ref=$REF"                          >> "$GITHUB_OUTPUT"
          echo "rocm_tag=$ROCM_TAG"                >> "$GITHUB_OUTPUT"
          echo "gpu_targets=$GPU_TARGETS"          >> "$GITHUB_OUTPUT"
          echo "tag=${REF}${ARCH_SUFFIX}${ROCM_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/llamacpp-hip" >> "$GITHUB_OUTPUT"
          echo "Pinning llama.cpp @ $REF | ROCm $ROCM_TAG | arch $GPU_TARGETS -> ghcr.io/$OWNER/llamacpp-hip:${REF}${ARCH_SUFFIX}${ROCM_SUFFIX}"

      # The ROCm dev base is ~8GB compressed and the build tree adds several more;
      # a stock runner does not have room. Same action and settings upstream
      # llama.cpp uses for its own rocm image (.github/workflows/docker.yml).
      - name: Free disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in; no PAT anywhere

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            LLAMA_REF=${{ steps.vars.outputs.ref }}
            ROCM_TAG=${{ steps.vars.outputs.rocm_tag }}
            GPU_TARGETS=${{ steps.vars.outputs.gpu_targets }}
          # :latest is opt-in only. Pinned tags are the product; a moving
          # :latest would defeat the reproducibility the pin exists for.
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ (github.event_name == 'workflow_dispatch' && inputs.push_latest) && format('{0}:latest', steps.vars.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
            echo '```'
            echo ""
            echo "llama.cpp pin: \`${{ steps.vars.outputs.ref }}\`"
            echo ""
            echo "ROCm base: \`${{ steps.vars.outputs.rocm_tag }}\`"
            echo ""
            echo "HIP targets: \`${{ steps.vars.outputs.gpu_targets }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
