name: Build pinned llama.cpp HIP image

on:
  push:
    tags:
      - 'llama-*'          # tag encodes the pin, e.g. llama-6036c635e
  workflow_dispatch:
    inputs:
      ref:
        description: 'llama.cpp commit/tag to pin (e.g. 6036c635e)'
        required: true
        type: string
      push_latest:
        description: 'Also tag this image :latest'
        required: false
        default: false
        type: boolean
      rocm_tag:
        description: 'ROCm base image tag (default 10.0.0-full; 7.14.0-full for the 2026-08 reference)'
        required: false
        default: '10.0.0-full'
        type: string
      gpu_targets:
        description: 'HIP arch(s), ";"-separated (default gfx942;gfx950 - one image for MI300X/MI325X/MI350X/MI355X)'
        required: false
        default: 'gfx942;gfx950'
        type: string
      image_rev:
        description: 'Tag suffix for a rebuild that changes the image but not the pin (e.g. r2)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve LLAMA_REF and image name
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${GITHUB_REF_NAME#llama-}"      # llama-6036c635e -> 6036c635e
          fi
          [ -n "$REF" ] || { echo "could not resolve LLAMA_REF"; exit 1; }
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # A tag push carries no inputs, so it builds the defaults: ROCm 10 and
          # gfx942+gfx950. Only workflow_dispatch can select another variant.
          ROCM_TAG="${{ inputs.rocm_tag }}"
          ROCM_TAG="${ROCM_TAG:-10.0.0-full}"
          # The image tag names the llama.cpp pin. Suffixes describe the contents,
          # not the default, so every existing tag keeps its meaning: no suffix =
          # ROCm 7.14 (the 2026-08 reference builds), -rocm10 = ROCm 10.
          if [ "$ROCM_TAG" = "7.14.0-full" ]; then
            ROCM_SUFFIX=""
          else
            ROCM_SUFFIX="-rocm${ROCM_TAG%%.*}"     # 10.0.0-full -> -rocm10
          fi
          # HIP arch(s). Multi-target emits one fat binary carrying code for every
          # arch, as upstream's own release job does; the runtime picks the code
          # object matching the card, so one tag serves gfx942 and gfx950 alike and
          # cross-arch runs share one build. No suffix = gfx942 only.
          GPU_TARGETS="${{ inputs.gpu_targets }}"
          GPU_TARGETS="${GPU_TARGETS:-gfx942;gfx950}"
          case "$GPU_TARGETS" in
            gfx942)  ARCH_SUFFIX="" ;;
            *\;*) ARCH_SUFFIX="-multi" ;;
            *)       ARCH_SUFFIX="-${GPU_TARGETS}" ;;
          esac
          # Same pin, changed image (e.g. a bootstrap fix): a new tag rather than an
          # overwrite, so a host that cached the old image cannot keep serving it.
          IMAGE_REV="${{ inputs.image_rev }}"
          case "$IMAGE_REV" in
            '')           REV_SUFFIX="" ;;
            *[!a-z0-9.]*) echo "image_rev must match [a-z0-9.]+, got '$IMAGE_REV'"; exit 1 ;;
            *)            REV_SUFFIX="-${IMAGE_REV}" ;;
          esac
          TAG="${REF}${ARCH_SUFFIX}${ROCM_SUFFIX}${REV_SUFFIX}"
          echo "ref=$REF"                          >> "$GITHUB_OUTPUT"
          echo "rocm_tag=$ROCM_TAG"                >> "$GITHUB_OUTPUT"
          echo "gpu_targets=$GPU_TARGETS"          >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                          >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/llamacpp-hip" >> "$GITHUB_OUTPUT"
          echo "Pinning llama.cpp @ $REF | ROCm $ROCM_TAG | arch $GPU_TARGETS -> ghcr.io/$OWNER/llamacpp-hip:$TAG"

      # The ROCm dev base is ~8GB compressed and the build tree adds several more;
      # a stock runner does not have room. Same action and settings upstream
      # llama.cpp uses for its own rocm image (.github/workflows/docker.yml).
      - name: Free disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in; no PAT anywhere

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            LLAMA_REF=${{ steps.vars.outputs.ref }}
            ROCM_TAG=${{ steps.vars.outputs.rocm_tag }}
            GPU_TARGETS=${{ steps.vars.outputs.gpu_targets }}
          # :latest is opt-in only. Pinned tags are the product; a moving
          # :latest would defeat the reproducibility the pin exists for.
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ (github.event_name == 'workflow_dispatch' && inputs.push_latest) && format('{0}:latest', steps.vars.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
            echo '```'
            echo ""
            echo "llama.cpp pin: \`${{ steps.vars.outputs.ref }}\`"
            echo ""
            echo "ROCm base: \`${{ steps.vars.outputs.rocm_tag }}\`"
            echo ""
            echo "HIP targets: \`${{ steps.vars.outputs.gpu_targets }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
